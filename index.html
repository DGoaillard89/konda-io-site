<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Konda.io — The Konda app family</title>
  <meta name="description" content="Konda builds focused software for field teams: asset management, training, RAMS, sensors, lab results and job management." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg__glow bg__glow--a"></div>
    <div class="bg__glow bg__glow--b"></div>
    <div class="bg__grid"></div>
  </div>

  <header class="nav">
    <a href="#" class="brand" aria-label="Konda home">
      <svg class="brand__mark" viewBox="0 0 325 417" aria-hidden="true">
        <defs>
          <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8b5cf6" />
            <stop offset="1" stop-color="#d946ef" />
          </linearGradient>
        </defs>
        <g fill="url(#brandGrad)">
          <polygon points="0,0 158,0 0,233" />
          <polygon points="285,0 325,0 325,417 297,417 160,190" />
          <polygon points="0,417 93,282 170,417" />
        </g>
      </svg>
      <span class="brand__name">Konda</span>
    </a>
    <a class="nav__cta" href="mailto:hello@konda.io">Get in touch</a>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">The Konda app family</p>
      <h1>Software that keeps<br /><span class="grad-text">work moving.</span></h1>
      <p class="lede">Six focused apps for teams in the field, the office and the lab — built to work on their own or together.</p>
    </section>

    <section class="showcase" aria-roledescription="carousel" aria-label="Konda apps">
      <button class="arrow arrow--prev" aria-label="Previous app">
        <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
      </button>

      <div class="stage" id="stage"></div>

      <button class="arrow arrow--next" aria-label="Next app">
        <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg>
      </button>
    </section>

    <nav class="switcher" id="switcher" aria-label="Choose an app"></nav>
  </main>

  <footer class="footer">
    <span>© <span id="year"></span> Konda.io</span>
    <a href="mailto:hello@konda.io">hello@konda.io</a>
  </footer>

  <script src="script.js"></script>
</body>
</html>
