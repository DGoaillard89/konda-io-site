name = "konda-enquiries"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://konda.io,https://www.konda.io,https://legionella-risk-assessments.com,https://www.legionella-risk-assessments.com"

# Airtable base and table (from the Airtable URL: airtable.com/appXXXX/tblYYYY/...)
AIRTABLE_BASE_ID = "appozyzPRV3guZNQx"
AIRTABLE_TABLE = "tbl3ime8pL7Iqx1s7"

# Airtable column names, exactly as they appear in the table
FIELD_NAME = "Name"
FIELD_EMAIL = "Email"
FIELD_PHONE = "Phone Number"
FIELD_POSTCODE = "Postcode"
FIELD_ENQUIRY_TYPE = "Service Type"
FIELD_MESSAGE = "Message"

# Every new enquiry starts at this pipeline stage
FIELD_STATUS = "Status"
STATUS_VALUE = "New Lead"

# Every new enquiry is assigned to this Airtable user
FIELD_LEAD_OWNER = "Lead Owner"
LEAD_OWNER_EMAIL = "daniel@dswater.co.uk"

# The site the enquiry was sent from, as a bare domain, e.g. konda.io
FIELD_WEBSITE = "Website"

# The Airtable token is a secret, set with:  npx wrangler secret put AIRTABLE_TOKEN
